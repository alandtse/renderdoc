name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC; skips immediately if upstream hasn't moved
  workflow_dispatch:

jobs:
  sync:
    name: Merge upstream v1.x into dev
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          # Prefer a PAT/fine-grained token (contents:write + workflows:write) if
          # provided: the default GITHUB_TOKEN cannot push changes under
          # .github/workflows/, so upstream CI changes would otherwise be unpushable.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/baldurk/renderdoc.git
          git fetch upstream v1.x

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/v1.x)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          if git merge-base --is-ancestor upstream/v1.x HEAD; then
            echo "Dev already contains upstream/v1.x — nothing to do."
            echo "status=current" >> $GITHUB_OUTPUT
          else
            echo "status=behind" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream into dev
        id: merge
        if: steps.check.outputs.status == 'behind'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/v1.x)
          if ! git merge --no-ff -m "chore(upstream-sync): merge upstream v1.x ${DATE} (${UPSTREAM_SHORT})" upstream/v1.x; then
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Push separately: a clean merge can still be rejected when it touches
          # .github/workflows/** and the token lacks the workflow scope. Capture
          # that instead of letting the step die silently without opening an issue.
          if git push origin dev; then
            echo "status=ok" >> $GITHUB_OUTPUT
          else
            echo "status=push_failed" >> $GITHUB_OUTPUT
          fi

      - name: Open issue on sync failure
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'push_failed'
        run: |
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"

          # Don't pile up a new issue every day while the same failure persists.
          OPEN=$(gh issue list --label upstream-sync --state open --json number --jq 'length')
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "An open upstream-sync issue already exists — not opening another."
            exit 0
          fi
          # The label may not exist yet (first failure); create it idempotently.
          gh label create upstream-sync --color B60205 \
            --description "Automated upstream sync needs attention" 2>/dev/null || true

          if [ "${{ steps.merge.outputs.status }}" = "conflict" ]; then
            REASON="Automated merge of upstream \`v1.x\` into \`dev\` failed due to **conflicts**."
          else
            REASON="The merge succeeded but the **push was rejected**: it modifies files under \`.github/workflows/\`, which the default \`GITHUB_TOKEN\` is not allowed to push. To automate this, add an \`UPSTREAM_SYNC_TOKEN\` repository secret (a PAT or fine-grained token with \`contents:write\` + \`workflows:write\`). Until then, sync manually."
          fi

          # gh occasionally can't find a label it (or a prior run) just created,
          # likely GitHub API propagation lag — don't let that swallow the report.
          gh issue create \
            --title "Upstream sync failed — manual resolution needed" \
            --label "upstream-sync" \
            --body "${REASON}

          Upstream is at: https://github.com/baldurk/renderdoc/commit/${UPSTREAM_SHA}

          To resolve manually:
          \`\`\`bash
          git fetch upstream
          git checkout dev
          git merge upstream/v1.x
          # resolve any conflicts, then:
          git push origin dev
          \`\`\`" || gh issue create \
            --title "Upstream sync failed — manual resolution needed" \
            --body "${REASON}

          Upstream is at: https://github.com/baldurk/renderdoc/commit/${UPSTREAM_SHA}

          To resolve manually:
          \`\`\`bash
          git fetch upstream
          git checkout dev
          git merge upstream/v1.x
          # resolve any conflicts, then:
          git push origin dev
          \`\`\`"
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
