ci:
  autofix_prs: true
  autofix_commit_msg: 'style: apply clang-format fixes'
  autoupdate_schedule: monthly
  autoupdate_commit_msg: 'chore: update pre-commit hook versions'

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v15.0.7
    hooks:
      - id: clang-format
        types_or: [c, c++, objective-c]
        files: ^(qrenderdoc|renderdoc|renderdoccmd|renderdocshim|util/test/demos)/
        exclude: /(3rdparty|official)/
